<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NyawitAI | Orbit Version 1.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root { 
            --glass: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #0ea5e9;
        }
        
        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; height: 100dvh; 
            background: #020617; color: white; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; 
        }

        /* =========================================
           biji ini music cok
           ========================================= */
        #init-screen {
            position: fixed; inset: 0; z-index: 10000;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .init-btn {
            background: transparent; border: 2px solid #0ea5e9;
            color: #0ea5e9; font-size: 16px; font-family: 'Courier New', Courier, monospace;
            padding: 15px 30px; letter-spacing: 5px; cursor: pointer;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5), inset 0 0 15px rgba(14, 165, 233, 0.5);
            transition: 0.3s; text-transform: uppercase;
            animation: pulseBtn 2s infinite alternate;
        }
        .init-btn:hover { background: rgba(14, 165, 233, 0.2); transform: scale(1.05); }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 10px rgba(14, 165, 233, 0.5); } 100% { box-shadow: 0 0 30px rgba(14, 165, 233, 1); } }

        /* =========================================
           ✨ LOADING SCREEN MEWAH (10 DETIK)
           ========================================= */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #0f172a, #000);
            display: none; /* Disembunyikan sampai inisialisasi diklik */
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .gyro-container { position: relative; width: 200px; height: 200px; perspective: 800px; margin-bottom: 40px; }
        .gyro-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { border-top: 3px solid #0ea5e9; border-bottom: 3px solid #db2777; box-shadow: 0 0 20px rgba(14, 165, 233, 0.5), inset 0 0 20px rgba(219, 39, 119, 0.5); animation: spinX 2s linear infinite; }
        .ring-2 { border-right: 3px solid #7e22ce; border-left: 3px solid #3b82f6; box-shadow: 0 0 20px rgba(126, 34, 206, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.5); animation: spinY 2.5s linear infinite; }
        .ring-3 { border-top: 3px solid #fff; border-bottom: 3px solid #0ea5e9; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(14, 165, 233, 0.5); animation: spinZ 3s linear infinite; }
        .gyro-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #fff; border-radius: 50%; box-shadow: 0 0 50px #fff, 0 0 100px #0ea5e9, 0 0 150px #db2777; animation: corePulse 1s infinite alternate; }

        @keyframes spinX { 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spinY { 100% { transform: rotateY(360deg) rotateZ(180deg); } }
        @keyframes spinZ { 100% { transform: rotateZ(360deg) rotateX(180deg); } }
        @keyframes corePulse { 0% { transform: translate(-50%, -50%) scale(0.8); } 100% { transform: translate(-50%, -50%) scale(1.2); } }

        #load-text { font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #0ea5e9; text-shadow: 0 0 10px #0ea5e9; margin-bottom: 20px; text-transform: uppercase; }
        .progress-bar-container { width: 250px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #0ea5e9, #db2777); box-shadow: 0 0 10px #db2777; transition: width 0.1s linear; }

        /* =========================================
           ✨ BACKGROUND GELAP & BINTANG JATUH
           ========================================= */
        #bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(45deg, #020617, #0f172a, #170f2e, #020617); background-size: 300% 300%; animation: auroraBG 10s ease infinite; }
        @keyframes auroraBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        #stars-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .shooting-star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff, 0 0 20px #fff; animation: shoot linear infinite; opacity: 0; }
        .shooting-star::before { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 1px; background: linear-gradient(90deg, #fff, transparent); }
        @keyframes shoot { 0% { transform: rotate(315deg) translateX(0); opacity: 1; } 100% { transform: rotate(315deg) translateX(-1200px); opacity: 0; } }

        /* =========================================
           ✨ AI ORB (YANG SANGAT TERANG & JELAS)
           ========================================= */
        #orb-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
        .orb { position: relative; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(14, 165, 233, 0.4) 0%, transparent 70%); box-shadow: 0 0 50px rgba(14, 165, 233, 0.6), inset 0 0 20px rgba(14, 165, 233, 0.8); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: pulseIdle 4s infinite ease-in-out; transition: all 0.4s ease; }
        .orb::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px #fff, 0 0 80px #0ea5e9; filter: blur(3px); transition: all 0.4s ease; }
        .orb.thinking { background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, transparent 70%); box-shadow: 0 0 80px rgba(236, 72, 153, 0.8), inset 0 0 40px rgba(236, 72, 153, 1); animation: pulseThink 1s infinite ease-in-out; }
        .orb.thinking::after { box-shadow: 0 0 50px #fff, 0 0 100px #ec4899; width: 60px; height: 60px; }

        @keyframes pulseIdle { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        @keyframes pulseThink { 0%, 100% { transform: scale(1.1); } 25% { transform: scale(1.3); } 50% { transform: scale(1.15); } 75% { transform: scale(1.35); } }

        /* =========================================
           ✨ LAYOUT CHAT UTAMA
           ========================================= */
        #app { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; opacity: 0; transition: opacity 1s ease-in-out; pointer-events: none;} 
        #app.active { pointer-events: auto; }

        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); }
        .title { font-weight: bold; font-size: 16px; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px var(--accent); }
        .btn-clear { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .btn-clear:active { background: rgba(239, 68, 68, 0.5); border-color: #ef4444; }

        #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; }
        #chat-history::-webkit-scrollbar { display: none; }

        .msg-container { display: flex; width: 100%; }
        .msg-container.user { justify-content: flex-end; }
        .msg-container.ai { justify-content: flex-start; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); font-size: 14px; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.3); word-wrap: break-word; }
        .user .bubble { background: rgba(255, 255, 255, 0.15); border-bottom-right-radius: 4px; }
        .ai .bubble { background: var(--glass); border-bottom-left-radius: 4px; }
        .ai .bubble pre { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1);}
        .ai .bubble p { margin: 0 0 10px 0; }
        .ai .bubble p:last-child { margin: 0; }

        footer { padding: 15px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); }
        .input-wrapper { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; align-items: flex-end; }
        #userInput { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 12px 16px; border-radius: 20px; font-size: 15px; outline: none; transition: 0.3s; }
        #userInput:focus { border-color: #fff; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        #sendBtn { background: linear-gradient(45deg, #0ea5e9, #8b5cf6); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); transition: 0.2s; }
        #sendBtn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.image2url.com/r2/default/audio/1781680899552-bacc1cfb-877c-43b3-8006-f45933a91f0d.mp3" type="audio/mpeg">
    </audio>

    <div id="init-screen">
        <button class="init-btn" id="start-btn">KLIK UNTUK MASUK KE SISTEM AI</button>
    </div>

    <div id="loading-screen">
        <div class="gyro-container">
            <div class="gyro-ring ring-1"></div>
            <div class="gyro-ring ring-2"></div>
            <div class="gyro-ring ring-3"></div>
            <div class="gyro-core"></div>
        </div>
        <div id="load-text">MENGHUBUNGKAN SATELIT...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="load-bar"></div>
        </div>
    </div>

    <div id="bg"></div>
    <div id="stars-container"></div>
    <div id="orb-container"><div class="orb" id="aiOrb"></div></div>

    <div id="app">
        <header>
            <div class="title">🧠 NyawitAI Beta Version 1.0</div>
            <button class="btn-clear" onclick="clearChat()">Bersihkan Chat 💬</button>
        </header>
        <main id="chat-history"></main>
        <footer>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ketik pesan Anda..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </footer>
    </div>

    <script>
        // Logika Inisialisasi & Loading 10 Detik
        const initScreen = document.getElementById('init-screen');
        const startBtn = document.getElementById('start-btn');
        const loadScreen = document.getElementById('loading-screen');
        const loadText = document.getElementById('load-text');
        const loadBar = document.getElementById('load-bar');
        const appContainer = document.getElementById('app');
        const bgMusic = document.getElementById('bgMusic');

        startBtn.addEventListener('click', () => {
            // Putar Musik
            bgMusic.volume = 0.5; // Setel volume (0.0 sampai 1.0)
            bgMusic.play().catch(e => console.log("Gagal memutar lagu: ", e));

            // Sembunyikan init, tampilkan loading
            initScreen.style.opacity = '0';
            setTimeout(() => {
                initScreen.style.display = 'none';
                loadScreen.style.display = 'flex';
                
                // Mulai Hitungan 10 Detik (10.000 ms)
                let progress = 0;
                const totalTime = 10000; 
                const intervalTime = 100; // Update setiap 100ms
                
                const loadInterval = setInterval(() => {
                    progress += (intervalTime / totalTime) * 100;
                    loadBar.style.width = progress + '%';

                    // Ubah teks berdasarkan persentase
                    if (progress < 25) loadText.innerText = "MENGHUBUNGKAN SATELIT...";
                    else if (progress < 50) loadText.innerText = "SINKRONISASI DATABASE...";
                    else if (progress < 75) loadText.innerText = "KALIBRASI ORBIT AI...";
                    else if (progress < 95) loadText.innerText = "MEMUAT MEMORI AI...";
                    else loadText.innerText = "WELCOME TO NYAWIT AI BY DITZZ.";

                    // Jika selesai 100%
                    if (progress >= 100) {
                        clearInterval(loadInterval);
                        setTimeout(() => {
                            loadScreen.style.opacity = '0';
                            loadScreen.style.transform = 'scale(1.1)';
                            appContainer.style.opacity = '1'; 
                            appContainer.classList.add('active');
                            setTimeout(() => { loadScreen.style.display = 'none'; }, 1000); 
                            
                            // Load Chat History setelah masuk
                            loadChatHistory();
                        }, 500);
                    }
                }, intervalTime);

            }, 500);
        });

        // Bintang Jatuh
        function createStars() {
            const container = document.getElementById('stars-container');
            const numStars = window.innerWidth < 600 ? 12 : 30; 
            for (let i = 0; i < numStars; i++) {
                let star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = Math.random() * 80 + 'vh';
                star.style.left = Math.random() * 150 + 'vw';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = 1 + Math.random() * 1.5 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // Chat & Orb
        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('userInput');
        const orb = document.getElementById('aiOrb');

        function loadChatHistory() {
            const savedChat = localStorage.getItem('nyawit_orbit_history_v4');
            if (savedChat) {
                chatHistory.innerHTML = savedChat;
                Prism.highlightAll();
                setTimeout(scrollToBottom, 100);
            } else {
                if(chatHistory.innerHTML === '') {
                    addMessage('ai', "Sistem NyawitAI aktif. Visualisasi orbit siap. Apa yang ingin Anda tanyakan hari ini?");
                }
            }
        }

        function scrollToBottom() { chatHistory.scrollTo({ top: chatHistory.scrollHeight, behavior: 'smooth' }); }

        function clearChat() {
            if(confirm("Hapus seluruh percakapan?")) {
                localStorage.removeItem('nyawit_orbit_history_v4');
                chatHistory.innerHTML = '';
                addMessage('ai', "Memori dibersihkan. Sistem siap menerima perintah baru.");
            }
        }

        function saveChat() { localStorage.setItem('nyawit_orbit_history_v4', chatHistory.innerHTML); }

        function addMessage(role, text, isHTML = false) {
            const containerDiv = document.createElement('div');
            containerDiv.className = `msg-container ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (isHTML) { bubble.innerHTML = text; } else { bubble.innerText = text; }
            containerDiv.appendChild(bubble);
            chatHistory.appendChild(containerDiv);
            scrollToBottom();
            return bubble;
        }

        async function sendMessage() {
            const query = input.value.trim();
            if (!query) return;

            input.value = ''; input.blur(); 
            addMessage('user', query); saveChat();

            const loadingBubble = addMessage('ai', "Memproses data... 💫", true);
            
            // TRIGGGER ANIMASI ORB (Menggunakan CSS Class)
            orb.classList.add('thinking');

            try {
                const res = await fetch(`https://api.siputzx.my.id/api/ai/gptoss120b?prompt=${encodeURIComponent(query)}&system=kamu adalah Nyawit AI yang di buat oleh ditzz kalo di tanya siapa pembuat mu kamu harus jawab ditzz,  kamu ai yang ramah dan penuh dengan rumor khas orang Indonesia dengan jokes-jokes yang sering bilang saya akan lawan dan hey antek antek asing, 19 juta lapangan pekerjaan.&temperature=0.7`);
                const data = await res.json();
                loadingBubble.innerHTML = marked.parse(data.data.response);
                Prism.highlightAll(); 
            } catch (err) {
                loadingBubble.innerHTML = `<span style="color: #fca5a5;">[Error] Gagal terhubung ke server.</span>`;
            }

            // HENTIKAN ANIMASI ORB
            orb.classList.remove('thinking');

            saveChat(); scrollToBottom();
        }

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
    </script>
</body>
</html>
