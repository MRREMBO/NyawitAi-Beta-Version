<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NyawitAI |  Version 2.0 (Multi-API)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root { 
            --glass: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #0ea5e9;
        }
        
        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; height: 100dvh; 
            background: #020617; color: white; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; 
            transition: background 0.5s;
        }

        #init-screen {
            position: fixed; inset: 0; z-index: 10000;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .init-btn {
            background: transparent; border: 2px solid #0ea5e9;
            color: #0ea5e9; font-size: 16px; font-family: 'Courier New', Courier, monospace;
            padding: 15px 30px; letter-spacing: 5px; cursor: pointer;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5), inset 0 0 15px rgba(14, 165, 233, 0.5);
            transition: 0.3s; text-transform: uppercase;
            animation: pulseBtn 2s infinite alternate;
        }
        .init-btn:hover { background: rgba(14, 165, 233, 0.2); transform: scale(1.05); }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 10px rgba(14, 165, 233, 0.5); } 100% { box-shadow: 0 0 30px rgba(14, 165, 233, 1); } }

        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #0f172a, #000);
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .gyro-container { position: relative; width: 200px; height: 200px; perspective: 800px; margin-bottom: 40px; }
        .gyro-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
        .ring-1 { border-top: 3px solid #0ea5e9; border-bottom: 3px solid #db2777; box-shadow: 0 0 20px rgba(14, 165, 233, 0.5), inset 0 0 20px rgba(219, 39, 119, 0.5); animation: spinX 2s linear infinite; }
        .ring-2 { border-right: 3px solid #7e22ce; border-left: 3px solid #3b82f6; box-shadow: 0 0 20px rgba(126, 34, 206, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.5); animation: spinY 2.5s linear infinite; }
        .ring-3 { border-top: 3px solid #fff; border-bottom: 3px solid #0ea5e9; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(14, 165, 233, 0.5); animation: spinZ 3s linear infinite; }
        .gyro-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #fff; border-radius: 50%; box-shadow: 0 0 50px #fff, 0 0 100px #0ea5e9, 0 0 150px #db2777; animation: corePulse 1s infinite alternate; }

        @keyframes spinX { 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spinY { 100% { transform: rotateY(360deg) rotateZ(180deg); } }
        @keyframes spinZ { 100% { transform: rotateZ(360deg) rotateX(180deg); } }
        @keyframes corePulse { 0% { transform: translate(-50%, -50%) scale(0.8); } 100% { transform: translate(-50%, -50%) scale(1.2); } }

        #load-text { font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #0ea5e9; text-shadow: 0 0 10px #0ea5e9; margin-bottom: 20px; text-transform: uppercase; }
        .progress-bar-container { width: 250px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #0ea5e9, #db2777); box-shadow: 0 0 10px #db2777; transition: width 0.1s linear; }

        #bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(45deg, #020617, #0f172a, #170f2e, #020617); background-size: 300% 300%; animation: auroraBG 10s ease infinite; }
        @keyframes auroraBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        #stars-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .shooting-star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff, 0 0 20px #fff; animation: shoot linear infinite; opacity: 0; }
        .shooting-star::before { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 1px; background: linear-gradient(90deg, #fff, transparent); }
        @keyframes shoot { 0% { transform: rotate(315deg) translateX(0); opacity: 1; } 100% { transform: rotate(315deg) translateX(-1200px); opacity: 0; } }

        #orb-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
        .orb { position: relative; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(14, 165, 233, 0.4) 0%, transparent 70%); box-shadow: 0 0 50px rgba(14, 165, 233, 0.6), inset 0 0 20px rgba(14, 165, 233, 0.8); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: pulseIdle 4s infinite ease-in-out; transition: all 0.4s ease; }
        .orb::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px #fff, 0 0 80px #0ea5e9; filter: blur(3px); transition: all 0.4s ease; }
        .orb.thinking { background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, transparent 70%); box-shadow: 0 0 80px rgba(236, 72, 153, 0.8), inset 0 0 40px rgba(236, 72, 153, 1); animation: pulseThink 1s infinite ease-in-out; }
        .orb.thinking::after { box-shadow: 0 0 50px #fff, 0 0 100px #ec4899; width: 60px; height: 60px; }

        /* INI ANIMASI BOLA YANG TADI HILANG */
        @keyframes pulseIdle {
            0% { transform: scale(1) translateY(0px); opacity: 0.7; }
            50% { transform: scale(1.05) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0px); opacity: 0.7; }
        }
        @keyframes pulseThink {
            0% { transform: scale(1); box-shadow: 0 0 80px rgba(236, 72, 153, 0.8), inset 0 0 40px rgba(236, 72, 153, 1); }
            50% { transform: scale(1.2); box-shadow: 0 0 120px rgba(236, 72, 153, 1), inset 0 0 60px rgba(236, 72, 153, 1); }
            100% { transform: scale(1); box-shadow: 0 0 80px rgba(236, 72, 153, 0.8), inset 0 0 40px rgba(236, 72, 153, 1); }
        }

        body.party-mode #bg { animation: partyBG 0.8s infinite alternate !important; }
        @keyframes partyBG { 0% { background: #ff0000; } 33% { background: #00ff00; } 66% { background: #0000ff; } 100% { background: #ff00ff; } }
        body.party-mode .orb { animation: pulseParty 0.2s infinite alternate !important; background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, transparent 70%); box-shadow: 0 0 100px #fff, 0 0 200px #ff00ff; }
        @keyframes pulseParty { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.5) rotate(180deg); } }
        body.party-mode .shooting-star { animation-duration: 0.2s !important; height: 5px; width: 5px; box-shadow: 0 0 20px #ff00ff; }

        #app { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; opacity: 0; transition: opacity 1s ease-in-out; pointer-events: none;} 
        #app.active { pointer-events: auto; }

        /* HEADER & MENU BARU */
        header { position: relative; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); z-index: 50;}
        .title { font-weight: bold; font-size: 16px; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px var(--accent); flex: 1; }
        
        .btn-control { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: 0.3s; white-space: nowrap; outline: none; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-control:active { transform: scale(0.95); }
        .btn-clear:active, .btn-clear:hover { background: rgba(239, 68, 68, 0.5); border-color: #ef4444; }
        .btn-download:active, .btn-download:hover { background: rgba(14, 165, 233, 0.5); border-color: #0ea5e9; }
        
        #menuToggleBtn { z-index: 51; }

        /* PANEL DROPDOWN MENU */
        .menu-panel {
            position: absolute;
            top: 65px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px);
            transition: all 0.3s ease;
            z-index: 100;
            min-width: 250px;
        }
        .menu-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        select.dropdown-menu { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer; }
        select.dropdown-menu option { background: #0f172a; color: #fff; }

        .menu-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .menu-buttons .btn-control { width: 100%; padding: 8px 5px; font-size: 12px;}

        #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; }
        #chat-history::-webkit-scrollbar { display: none; }

        .msg-container { display: flex; width: 100%; }
        .msg-container.user { justify-content: flex-end; }
        .msg-container.ai { justify-content: flex-start; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); font-size: 14px; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.3); word-wrap: break-word; position: relative; }
        .user .bubble { background: rgba(255, 255, 255, 0.15); border-bottom-right-radius: 4px; }
        .ai .bubble { background: var(--glass); border-bottom-left-radius: 4px; }
        
        .ai .bubble pre { background: rgba(0,0,0,0.6); padding: 30px 10px 10px 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
        .copy-btn:hover { background: rgba(255,255,255,0.4); }

        .ai .bubble p { margin: 0 0 10px 0; }
        .ai .bubble p:last-child { margin: 0; }
        .ai .bubble img { max-width: 100%; border-radius: 10px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: block; }

        .typing-dots { display: flex; gap: 5px; align-items: center; height: 20px; padding: 0 5px; }
        .typing-dots span { width: 8px; height: 8px; background: #0ea5e9; border-radius: 50%; animation: bounceDots 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDots { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        footer { padding: 15px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); }
        .input-wrapper { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; align-items: flex-end; }
        
        #micBtn { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: 0.3s; }
        #micBtn:hover { background: rgba(255, 255, 255, 0.2); }
        #micBtn.recording { background: rgba(239, 68, 68, 0.8); border-color: #ef4444; animation: pulseMic 1.5s infinite; }
        
        textarea#userInput { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 12px 16px; border-radius: 20px; font-size: 15px; outline: none; transition: 0.3s; resize: none; max-height: 120px; line-height: 1.4; font-family: inherit; scrollbar-width: none; overflow-y: hidden; }
        textarea#userInput:focus { border-color: #fff; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        
        #sendBtn { background: linear-gradient(45deg, #0ea5e9, #8b5cf6); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); transition: 0.2s; }
        #sendBtn:active { transform: scale(0.9); }

        #stopBtn { background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: none; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); transition: 0.2s; }
        #stopBtn:hover { background: #ef4444; transform: scale(1.05); }

    </style>
</head>
<body>

    <audio id="sfxSend" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sfxReceive" src="https://g.top4top.io/m_3824qlqkj0.mp3"></audio>

    <audio id="bgMusic" loop>
        <source src="https://d.top4top.io/m_3820ralgz0.mp3" type="audio/mpeg">
    </audio>

    <audio id="partyMusic" loop>
        <source src="https://g.top4top.io/m_3822qs5170.mp3" type="audio/mpeg">
    </audio>

    <div id="init-screen">
        <button class="init-btn" id="start-btn">KLIK UNTUK MASUK KE SISTEM AI</button>
    </div>

    <div id="loading-screen">
        <div class="gyro-container">
            <div class="gyro-ring ring-1"></div>
            <div class="gyro-ring ring-2"></div>
            <div class="gyro-ring ring-3"></div>
            <div class="gyro-core"></div>
        </div>
        <div id="load-text">MENGHUBUNGKAN SATELIT...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="load-bar"></div>
        </div>
    </div>

    <div id="bg"></div>
    <div id="stars-container"></div>
    <div id="orb-container"><div class="orb" id="aiOrb"></div></div>

    <div id="app">
        <header>
            <div class="title">🧠 NyawitAI Pro 5.0</div>
            
            <button id="menuToggleBtn" class="btn-control" onclick="toggleMenu()">⚙️ Menu</button>
            
            <div id="menuPanel" class="menu-panel">
                <select id="apiMenu" class="dropdown-menu" onchange="saveSettingsLocal()">
                    <option value="ditzz">🤖 Model: Nyawit AI (Bawaan)</option>
                    <option value="bard">🌟 Model: Gemini / Bard (No Support kepribadian)</option>
                    <option value="claude">🧠 Model: Claude AI (No Support Kepribadian)</option>
                    <option value="api_custom">🚀 Model: API Custom (Error)</option>
                </select>

                <select id="personaMenu" class="dropdown-menu" onchange="saveSettingsLocal()">
                    <option value="humor">😂 Kepribadian: Humoris</option>
                    <option value="pro">👔 Kepribadian: Profesional</option>
                    <option value="hacker">💻 Kepribadian: Hacker</option>
                    <option value="teman">🤗 Kepribadian: Teman Curhat</option>
                </select>

                <select id="featureMenu" class="dropdown-menu" onchange="updatePlaceholder()">
                    <option value="chat">💬 Chat AI</option>
                    <option value="/gambar">🎨 Gambar</option>
                    <option value="/cuaca">☁️ Cuaca</option>
                    <option value="/satelit">🛰️ Lacak ISS</option>
                    <option value="/qr">🔲 QR Code</option>
                    <option value="/download">📥 Download Video</option>
                    <option value="/party">🪩 Mode Pesta</option>
                </select>

                <div class="menu-buttons">
                    <button id="musicBtn" class="btn-control" onclick="toggleMusic()">Musik: ON 🎵</button>
                    <button id="voiceBtn" class="btn-control btn-voice" onclick="toggleVoice()">Suara: ON 🔊</button>
                    <button class="btn-control btn-download" onclick="exportChat()">Unduh 💾</button>
                    <button class="btn-control btn-clear" onclick="clearChat()">Bersih 💬</button>
                </div>
            </div>
        </header>

        <main id="chat-history"></main>
        
        <footer>
            <div class="input-wrapper">
                <button id="micBtn" onclick="startDictation()" title="Gunakan Suara">🎤</button>
                <textarea id="userInput" rows="1" placeholder="Ketik pesan untuk Ditzz AI... (Shift+Enter untuk baris baru)" autocomplete="off"></textarea>
                <button id="sendBtn" onclick="sendMessage()" title="Kirim">➤</button>
                <button id="stopBtn" onclick="stopGeneration()" title="Berhenti">🛑</button>
            </div>
        </footer>
    </div>

    <script>
        const initScreen = document.getElementById('init-screen');
        const startBtn = document.getElementById('start-btn');
        const loadScreen = document.getElementById('loading-screen');
        const loadText = document.getElementById('load-text');
        const loadBar = document.getElementById('load-bar');
        const appContainer = document.getElementById('app');
        const bgMusic = document.getElementById('bgMusic');
        const partyMusic = document.getElementById('partyMusic');
        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('userInput');
        const orb = document.getElementById('aiOrb');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');

        const sfxSend = document.getElementById('sfxSend');
        const sfxReceive = document.getElementById('sfxReceive');

        let isGenerating = false;
        let abortController = null;

        let settings = { music: true, voice: true, persona: 'humor', apiModel: 'ditzz' };

        function toggleMenu() {
            const panel = document.getElementById('menuPanel');
            panel.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const panel = document.getElementById('menuPanel');
            const btn = document.getElementById('menuToggleBtn');
            if (!panel.contains(event.target) && event.target !== btn && !btn.contains(event.target)) {
                panel.classList.remove('active');
            }
        });

        function exportChat() {
            const chatContent = document.getElementById('chat-history').innerText;
            if(!chatContent.trim()) { alert("Riwayat chat masih kosong!"); return; }
            
            const blob = new Blob([chatContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'NyawitAI_History.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadSettingsLocal() {
            const saved = localStorage.getItem('nyawit_settings_v5');
            if(saved) settings = JSON.parse(saved);
            
            document.getElementById('personaMenu').value = settings.persona;
            if(document.getElementById('apiMenu')) {
                document.getElementById('apiMenu').value = settings.apiModel || 'ditzz';
            }
            
            const voiceBtn = document.getElementById('voiceBtn');
            if(settings.voice) {
                voiceBtn.innerHTML = 'Suara: ON 🔊'; voiceBtn.style.background = 'rgba(14, 165, 233, 0.2)';
            } else {
                voiceBtn.innerHTML = 'Suara: OFF 🔇'; voiceBtn.style.background = 'rgba(255, 255, 255, 0.1)';
            }

            const musicBtn = document.getElementById('musicBtn');
            if(settings.music) {
                musicBtn.innerHTML = 'Musik: ON 🎵'; musicBtn.style.background = 'rgba(16, 185, 129, 0.2)'; musicBtn.style.borderColor = '#10b981';
            } else {
                musicBtn.innerHTML = 'Musik: OFF 🔇'; musicBtn.style.background = 'rgba(255, 255, 255, 0.1)'; musicBtn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            }
        }

        function saveSettingsLocal() {
            settings.persona = document.getElementById('personaMenu').value;
            settings.apiModel = document.getElementById('apiMenu').value;
            localStorage.setItem('nyawit_settings_v5', JSON.stringify(settings));
        }

        function getSystemPrompt() {
            const p = settings.persona;
            if(p === 'pro') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu adalah asisten profesional yang menjawab dengan sangat formal, akurat, padat, dan jelas tanpa basa-basi.";
            if(p === 'hacker') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu berbicara selayaknya hacker elit, sering menggunakan istilah teknis komputer, cyber security, dan menjawab dengan gaya misterius.";
            if(p === 'teman') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu adalah teman curhat yang sangat empatik, pendengar yang baik, hangat, dan selalu memberikan dukungan moral dengan bahasa santai gaul Indonesia.";
            return "kamu adalah Nyawit AI yang di buat oleh ditzz kalo di tanya siapa pembuat mu kamu harus jawab ditzz, kamu ai yang ramah dan penuh dengan humor khas orang Indonesia dengan jokes-jokes yang sering bilang : saya akan lawan, dan hey antek antek asing, 19 juta lapangan pekerjaan, dan juga kamu harus kirim emoji setiap di tanya agar lebih humoris jangan lupa jokes nya setiap chat ya";
        }

        input.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + "px";
            if(this.value === "") this.style.height = "auto";
        });

        function toggleVoice() {
            settings.voice = !settings.voice;
            saveSettingsLocal();
            const voiceBtn = document.getElementById('voiceBtn');
            if (settings.voice) {
                voiceBtn.innerHTML = 'Suara: ON 🔊'; voiceBtn.style.background = 'rgba(14, 165, 233, 0.2)';
            } else {
                voiceBtn.innerHTML = 'Suara: OFF 🔇'; voiceBtn.style.background = 'rgba(255, 255, 255, 0.1)';
                if('speechSynthesis' in window) window.speechSynthesis.cancel(); 
            }
        }

        function speakText(text) {
            if (settings.voice && 'speechSynthesis' in window && !isGenerating) {
                let cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*#_]/g, '');
                let msg = new SpeechSynthesisUtterance(cleanText);
                msg.lang = 'id-ID'; msg.rate = 1.1; msg.pitch = 1.2; 
                window.speechSynthesis.speak(msg);
            }
        }

        function toggleMusic() {
            settings.music = !settings.music;
            saveSettingsLocal();
            const musicBtn = document.getElementById('musicBtn');
            const isParty = document.body.classList.contains('party-mode');

            if (!settings.music) {
                bgMusic.pause(); partyMusic.pause();
                musicBtn.innerHTML = 'Musik: OFF 🔇'; musicBtn.style.background = 'rgba(255, 255, 255, 0.1)'; musicBtn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            } else {
                if (isParty) partyMusic.play().catch(e => console.log(e));
                else bgMusic.play().catch(e => console.log(e));
                musicBtn.innerHTML = 'Musik: ON 🎵'; musicBtn.style.background = 'rgba(16, 185, 129, 0.2)'; musicBtn.style.borderColor = '#10b981';
            }
        }

        function updatePlaceholder() {
            const menu = document.getElementById('featureMenu').value;
            if (menu === 'chat') { input.placeholder = "Ketik pesan... (Shift+Enter untuk baris baru)"; input.disabled = false; } 
            else if (menu === '/satelit' || menu === '/party') { input.placeholder = "Tekan ➤ untuk mengeksekusi perintah ini"; input.value = ""; input.disabled = true; } 
            else if (menu === '/download') { input.placeholder = "Tempel link URL video di sini..."; input.disabled = false; }
            else { input.placeholder = `Ketik parameter untuk ${menu}...`; input.disabled = false; }
            input.style.height = "auto";
        }

        startBtn.addEventListener('click', () => {
            loadSettingsLocal(); 
            if(settings.music) {
                bgMusic.volume = 0.5; bgMusic.play().catch(e => console.log(e));
            }

            initScreen.style.opacity = '0';
            setTimeout(() => {
                initScreen.style.display = 'none'; loadScreen.style.display = 'flex';
                let progress = 0; const totalTime = 3000; const intervalTime = 100; 
                const loadInterval = setInterval(() => {
                    progress += (intervalTime / totalTime) * 100;
                    loadBar.style.width = progress + '%';
                    if (progress < 25) loadText.innerText = "MENGHUBUNGKAN SATELIT...";
                    else if (progress < 50) loadText.innerText = "SINKRONISASI DATABASE...";
                    else if (progress < 75) loadText.innerText = "MEMUAT KEPRIBADIAN AI...";
                    else loadText.innerText = "WELCOME TO NYAWIT AI BY DITZZ.";

                    if (progress >= 100) {
                        clearInterval(loadInterval);
                        setTimeout(() => {
                            loadScreen.style.opacity = '0'; loadScreen.style.transform = 'scale(1.1)';
                            appContainer.style.opacity = '1'; appContainer.classList.add('active');
                            setTimeout(() => { loadScreen.style.display = 'none'; }, 1000); 
                            loadChatHistory();
                            speakText("Sistem Nyawit AI versi 2 siap digunakan.");
                        }, 500);
                    }
                }, intervalTime);
            }, 500);
        });

        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < (window.innerWidth < 600 ? 12 : 30); i++) {
                let star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = Math.random() * 80 + 'vh'; star.style.left = Math.random() * 150 + 'vw';
                star.style.animationDelay = Math.random() * 5 + 's'; star.style.animationDuration = 1 + Math.random() * 1.5 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        function loadChatHistory() {
            const savedChat = localStorage.getItem('nyawit_history_v8');
            if (savedChat) {
                chatHistory.innerHTML = savedChat;
                addCopyButtons(); Prism.highlightAll(); setTimeout(scrollToBottom, 100);
            } else {
                if(chatHistory.innerHTML === '') addMessage('ai', "Sistem NyawitAI 5.0 aktif. Gunakan menu ⚙️ Pengaturan di atas untuk beralih fitur atau Model AI!");
            }
        }

        function scrollToBottom() { chatHistory.scrollTo({ top: chatHistory.scrollHeight, behavior: 'smooth' }); }
        function saveChat() { localStorage.setItem('nyawit_history_v8', chatHistory.innerHTML); }

        function clearChat() {
            if(confirm("Hapus seluruh percakapan?")) {
                localStorage.removeItem('nyawit_history_v8'); chatHistory.innerHTML = '';
                addMessage('ai', "Memori dibersihkan. Sistem siap.");
            }
        }

        function addCopyButtons() {
            document.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn'; btn.innerText = '📋 Salin';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.innerText.replace('📋 Salin', '').trim());
                    btn.innerText = '✅ Disalin!'; setTimeout(() => btn.innerText = '📋 Salin', 2000);
                };
                pre.appendChild(btn);
            });
        }

        function addMessage(role, text, isHTML = false) {
            const containerDiv = document.createElement('div');
            containerDiv.className = `msg-container ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (isHTML) bubble.innerHTML = text; else bubble.innerText = text;
            containerDiv.appendChild(bubble); chatHistory.appendChild(containerDiv);
            scrollToBottom(); return bubble;
        }

        function showTypingIndicator() {
            const containerDiv = document.createElement('div');
            containerDiv.className = `msg-container ai`; containerDiv.id = "typingIndicator";
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            containerDiv.appendChild(bubble); chatHistory.appendChild(containerDiv); scrollToBottom();
        }
        function hideTypingIndicator() {
            const indicator = document.getElementById("typingIndicator");
            if(indicator) indicator.remove();
        }

        async function typeWriterEffect(element, markdownText) {
            let buffer = "";
            let chunkSize = 4;
            sfxReceive.currentTime = 0; sfxReceive.play().catch(()=>{});

            for (let i = 0; i < markdownText.length; i += chunkSize) {
                if (!isGenerating) break; 
                buffer += markdownText.substring(i, i + chunkSize);
                element.innerHTML = marked.parse(buffer);
                scrollToBottom();
                await new Promise(r => setTimeout(r, 15)); 
            }
            
            element.innerHTML = marked.parse(markdownText);
            Prism.highlightAllUnder(element); 
            addCopyButtons();
        }

        function stopGeneration() {
            if(abortController) abortController.abort(); 
            isGenerating = false;
            sendBtn.style.display = 'flex'; stopBtn.style.display = 'none';
            orb.classList.remove('thinking');
            hideTypingIndicator();
            speakText("Proses dihentikan.");
        }

        // ==========================================
        // FUNGSI SAPU JAGAT PENCARI TEKS DARI API
        // ==========================================
        function findResponseText(obj) {
            if (typeof obj === 'string') return obj;
            if (!obj || typeof obj !== 'object') return JSON.stringify(obj);
            
            if (obj.result && obj.result.response && typeof obj.result.response === 'string') return obj.result.response;
            if (obj.result && obj.result.data && typeof obj.result.data === 'string') return obj.result.data;
            if (obj.result && typeof obj.result === 'string') return obj.result;
            
            if (obj.data && obj.data.result && typeof obj.data.result === 'string') return obj.data.result;
            if (obj.data && obj.data.response && typeof obj.data.response === 'string') return obj.data.response;
            if (obj.data && typeof obj.data === 'string') return obj.data;
            
            if (obj.response && typeof obj.response === 'string') return obj.response;
            if (obj.message && typeof obj.message === 'string') return obj.message;

            return "```json\n" + JSON.stringify(obj, null, 2) + "\n```";
        }

        async function sendMessage() {
            if (isGenerating) return; 
            const menu = document.getElementById('featureMenu').value;
            let rawQuery = input.value.trim();
            
            if (!rawQuery && (menu === '/party' || menu === '/satelit')) rawQuery = menu;
            else if (!rawQuery) return; 

            let finalQuery = rawQuery;
            if (menu !== 'chat' && !finalQuery.startsWith(menu)) {
                finalQuery = (menu === '/party' || menu === '/satelit') ? menu : `${menu} ${finalQuery}`;
            }

            sfxSend.currentTime = 0; sfxSend.play().catch(()=>{});

            input.value = ''; input.style.height = "auto"; input.blur(); 
            addMessage('user', finalQuery); saveChat();

            orb.classList.add('thinking');
            isGenerating = true;
            sendBtn.style.display = 'none'; stopBtn.style.display = 'flex'; 
            
            if (finalQuery.toLowerCase() === '/party') {
                document.body.classList.toggle('party-mode');
                const isParty = document.body.classList.contains('party-mode');
                const statusTxt = isParty ? "DIAKTIFKAN! Waktunya berantas galau! 🎉🕺💃" : "DIMATIKAN. Kembali ke mode serius. 🛑";
                
                if (settings.music) {
                    if (isParty) { bgMusic.pause(); partyMusic.play().catch(e=>console.log(e)); } 
                    else { partyMusic.pause(); partyMusic.currentTime=0; bgMusic.play().catch(e=>console.log(e)); }
                }
                const bub = addMessage('ai', ""); 
                await typeWriterEffect(bub, `Mode Pesta **${statusTxt}**`);
                speakText(isParty ? "Mode pesta diaktifkan." : "Mode pesta dimatikan.");
                finishGeneration(); return;
            }

            showTypingIndicator(); 

            try {
                if (finalQuery.toLowerCase() === '/satelit') {
                    const satRes = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                    const satData = await satRes.json();
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `🛰️ **Data Pelacakan Satelit ISS:**\n- Latitude: **${satData.latitude.toFixed(4)}**\n- Longitude: **${satData.longitude.toFixed(4)}**\n- Kecepatan: **${Math.round(satData.velocity)} km/jam**\n- Ketinggian: **${Math.round(satData.altitude)} km**`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/cuaca ')) {
                    const city = finalQuery.substring(7).trim();
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=id&format=json`);
                    const geoData = await geoRes.json();
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    if (!geoData.results) { await typeWriterEffect(bub, `❌ Kota **${city}** tidak ditemukan di satelit.`); } 
                    else {
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geoData.results[0].latitude}&longitude=${geoData.results[0].longitude}&current_weather=true`);
                        const weatherData = await weatherRes.json();
                        await typeWriterEffect(bub, `📡 **Laporan Cuaca:**\nCuaca di kota **${geoData.results[0].name}** saat ini bersuhu **${weatherData.current_weather.temperature}°C** dengan kecepatan angin **${weatherData.current_weather.windspeed} km/jam**. 🌤️`);
                    }
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/qr ')) {
                    const qrData = finalQuery.substring(4).trim();
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrData)}`;
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `QR Code berhasil dibuat untuk: **${qrData}**\n<br><img src="${qrUrl}" alt="QR" style="background:white;padding:10px;">`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/gambar ')) {
                    const imgPrompt = finalQuery.substring(8).trim();
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?seed=${Math.floor(Math.random()*10000)}&width=512&height=512&nologo=true`;
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `Visualisasi untuk: **${imgPrompt}**\n<br><img src="${imgUrl}">`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/download ')) {
                    const videoUrl = finalQuery.substring(10).trim();
                    const dlApiUrl = `https://api-faa.my.id/faa/aio?url=${encodeURIComponent(videoUrl)}`;
                    
                    hideTypingIndicator(); 
                    const bub = addMessage('ai', "");
                    
                    try {
                        const dlRes = await fetch(dlApiUrl);
                        const dlData = await dlRes.json();
                        
                        if (dlData.status === true && dlData.result) {
                            const res = dlData.result;
                            let replyText = `📥 **Berhasil Menemukan Video! (Source: ${res.source})**\n\n`;
                            replyText += `**Judul:** ${res.title || "Tidak ada judul"}\n\n`;
                            replyText += `**Pilih Opsi Unduhan:**\n`;
                            
                            if (res.medias && res.medias.length > 0) {
                                res.medias.forEach(media => {
                                    replyText += `- [Download ${media.quality} (${media.extension})](${media.url})\n`;
                                });
                            } else {
                                replyText += `❌ Link media tidak ditemukan di dalam respons API.\n`;
                            }
                            
                            await typeWriterEffect(bub, replyText);
                        } else {
                            await typeWriterEffect(bub, `❌ Gagal memproses URL. Pastikan link yang dikirim valid dan tidak diprivate.`);
                        }
                    } catch (err) {
                        await typeWriterEffect(bub, `❌ Terjadi kesalahan koneksi saat mencoba mengambil video.`);
                    }
                    
                    finishGeneration(); return;
                }

                abortController = new AbortController();
                const timeoutId = setTimeout(() => abortController.abort(), 15000); 

                let apiResponseText = "";
                let apiUrl = "";
                
                // MENGUBAH TEKS MENJADI FORMAT URL AMAN
                const safePrompt = encodeURIComponent(getSystemPrompt());
                const safeQuery = encodeURIComponent(finalQuery);

                // --- SISTEM PELURU BANYAK: Memasukkan parameter text, query, dan q sekaligus ---
                if (settings.apiModel === 'ditzz') {
                    apiUrl = `https://api-faa.my.id/faa/ai-promt?prompt=${safePrompt}&query=${safeQuery}&text=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'bard') {
                    apiUrl = `https://api-faa.my.id/faa/bard-google?query=${safeQuery}&text=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'claude') {
                    apiUrl = `https://api-faa.my.id/faa/claude-ai?text=${safeQuery}&query=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'api_custom') {
                    apiUrl = `https://api-barumu.com/chat?text=${safeQuery}`;
                }

                if (apiUrl !== "") {
                    const res = await fetch(apiUrl, { signal: abortController.signal });
                    
                    const rawText = await res.text();
                    let parsedData;
                    
                    try {
                        parsedData = JSON.parse(rawText);
                    } catch (e) {
                        parsedData = rawText; 
                    }
                    
                    apiResponseText = findResponseText(parsedData);
                }

                clearTimeout(timeoutId);
                hideTypingIndicator();
                
                if (apiResponseText && apiResponseText.trim() !== "") {
                    const replyBubble = addMessage('ai', "");
                    await typeWriterEffect(replyBubble, apiResponseText);
                    
                    if (!apiResponseText.startsWith("```json")) {
                        speakText(apiResponseText);
                    }
                } else {
                    throw new Error("Dapat balasan, tapi kosong.");
                }

            } catch (err) {
                hideTypingIndicator();
                const errBubble = addMessage('ai', "");
                if (err.name === 'AbortError') {
                    errBubble.innerHTML = `<span style="color: #fca5a5;">[Sistem] Koneksi dibatalkan (timeout/lambat) atau dihentikan pengguna.</span>`;
                } else {
                    errBubble.innerHTML = `<span style="color: #fca5a5;">[Error] Gagal nyambung ke API. Pesan Error: ${err.message}</span>`;
                }
            }

            finishGeneration();
        }

        function finishGeneration() {
            isGenerating = false;
            sendBtn.style.display = 'flex'; stopBtn.style.display = 'none';
            orb.classList.remove('thinking');
            saveChat();
        }

        input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); sendMessage(); 
            } 
        });

        function startDictation() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = "id-ID";
                
                micBtn.classList.add('recording');
                input.placeholder = "Mendengarkan suara Anda...";
                recognition.start();

                recognition.onresult = function(e) { input.value += " " + e.results[0][0].transcript; input.style.height = "auto"; };
                recognition.onerror = function() { alert("Gagal mendeteksi suara."); };
                recognition.onend = function() { micBtn.classList.remove('recording'); updatePlaceholder(); };
            } else { alert("Browser tidak mendukung mikrofon."); }
        }
    </script>
</body>
