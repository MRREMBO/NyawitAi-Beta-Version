<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NyawitAI | UI Redesign V3</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --bg-main: #18181c; 
            --bg-card: #252530;
            --bg-bubble-ai: #2a2a35;
            --bg-bubble-user: #937cf7;
            --text-main: #ffffff;
            --text-muted: #8b8b9b;
            --accent: #937cf7;
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        
        * { box-sizing: border-box; font-family: 'Poppins', system-ui, sans-serif; }

        body, html { 
            margin: 0; padding: 0; height: 100dvh; 
            background: var(--bg-main); color: var(--text-main); 
            overflow: hidden; 
        }

        #bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; transition: background 0.5s ease; }

        /* ================= WELCOME SCREEN ================= */
        #welcome-screen {
            position: fixed; inset: 0; z-index: 10000;
            background: var(--bg-main); display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .welcome-robot {
            width: 200px; height: 200px;
            background: url('https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Robot.png') center/contain no-repeat;
            animation: float 4s ease-in-out infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            position: relative;
        }

        .bot-greeting-bubble {
            position: absolute; top: 10px; right: -40px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
            border: 1px solid var(--glass-border);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 1s; opacity: 0; transform: scale(0);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        .welcome-text { text-align: center; margin-bottom: 60px; }
        .welcome-text p { color: var(--text-muted); font-size: 16px; margin: 0 0 5px 0; }
        .welcome-text h1 { font-size: 32px; font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -0.5px; }

        .welcome-controls {
            display: flex; align-items: center; justify-content: space-between;
            width: 250px; position: absolute; bottom: 50px;
        }

        .ctrl-icon {
            color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.3s;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .ctrl-icon:hover { color: var(--text-main); transform: scale(1.1); }

        .glowing-orb-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff7eb3, #937cf7, #3b82f6);
            box-shadow: 0 0 20px rgba(147, 124, 247, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
            cursor: pointer; transition: 0.3s;
            animation: pulseOrb 2s infinite alternate;
        }
        .glowing-orb-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(147, 124, 247, 0.9); }
        @keyframes pulseOrb { 0% { box-shadow: 0 0 15px rgba(147, 124, 247, 0.5); } 100% { box-shadow: 0 0 35px rgba(147, 124, 247, 0.8), 0 0 60px rgba(59, 130, 246, 0.4); } }

        /* ================= MAIN APP ================= */
        #app { 
            position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; 
            max-width: 800px; margin: 0 auto; background: var(--bg-main);
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        } 
        #app.active { opacity: 1; pointer-events: auto; }

        header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-main); border-bottom: 1px solid var(--glass-border); z-index: 50;
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn, .menu-btn { 
            width: 35px; height: 35px; border-radius: 50%; border: none; color: white; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .back-btn { background: var(--bg-card); }
        .back-btn:hover { background: #353545; }
        .menu-btn { background: var(--bg-bubble-user); font-size: 14px; }
        
        .bot-info-header { display: flex; flex-direction: column; }
        .bot-name { font-weight: 600; font-size: 16px; }
        .bot-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 5px #4ade80;}

        /* SIDEBAR */
        #sidebar {
            position: fixed; left: -300px; top: 0; bottom: 0; width: 280px;
            background: rgba(24, 24, 28, 0.95); backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border); z-index: 99999;
            transition: left 0.3s ease; display: flex; flex-direction: column;
        }
        #sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items:center; padding: 20px; border-bottom: 1px solid var(--glass-border); }
        .sidebar-header h3 { margin: 0; color: var(--accent); font-size:16px;}
        .close-sb-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer;}
        
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .btn-control { background: var(--bg-card); border: 1px solid var(--glass-border); color: #fff; padding: 10px; border-radius: 12px; font-size: 13px; cursor: pointer; transition: 0.3s; width: 100%; display:flex; justify-content:center; align-items:center; gap:8px;}
        .btn-accent { background: var(--accent); border: none;}
        .btn-danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        select.dropdown-menu { width: 100%; background: var(--bg-card); border: 1px solid var(--glass-border); color: #fff; padding: 10px 12px; border-radius: 12px; font-size: 13px; outline: none; margin-bottom: 5px;}
        
        .chat-item { padding: 12px 15px; border-radius:12px; cursor: pointer; display: flex; justify-content: space-between; align-items:center; background: var(--bg-card); font-size:13px; margin-bottom: 8px;}
        .chat-item.active { background: rgba(147, 124, 247, 0.2); border: 1px solid var(--accent); color:white;}
        .chat-item button { background: none; border: none; cursor: pointer; color: var(--text-muted);}

        /* CHAT HISTORY */
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; }
        #chat-history::-webkit-scrollbar { display: none; }

        /* EMPTY STATE CARDS */
        #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .greeting-text { font-size: 14px; line-height: 1.6; margin-bottom: 30px; max-width: 80%; }
        .cards-container { display: flex; gap: 15px; overflow-x: auto; width: 100%; padding-bottom: 10px; scrollbar-width: none; padding: 0 20px; }
        .topic-card { min-width: 140px; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; text-align: left; height: 160px; }
        .card-1 { background: #bba8ff; color: #18181c; }
        .card-2 { background: #ffb8d0; color: #18181c; }
        .card-3 { background: #86efac; color: #18181c; }
        .card-icon { width: 30px; height: 30px; background: rgba(0,0,0,0.1); border-radius: 8px; display:flex; align-items:center; justify-content:center; margin-bottom: 20px; font-size: 16px;}
        .topic-card h4 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3;}

        /* BUBBLES */
        .msg-container { display: flex; width: 100%; margin-bottom: 5px; }
        .msg-container.user { justify-content: flex-end; }
        .msg-container.ai { justify-content: flex-start; }
        .bubble { max-width: 85%; padding: 14px 18px; border-radius: 24px; font-size: 14px; line-height: 1.6; word-wrap: break-word; position: relative; }
        .user .bubble { background: var(--bg-bubble-user); color: white; border-bottom-right-radius: 6px; }
        .ai .bubble { background: var(--bg-bubble-ai); color: white; border-bottom-left-radius: 6px; }
        .ai .bubble pre { background: #1a1a24; padding: 35px 15px 15px 15px; border-radius: 12px; overflow-x: auto; font-size: 12px; margin: 15px 0; border: 1px solid var(--glass-border); position: relative; }
        .ai .bubble img, .user .bubble img { max-width: 100%; border-radius: 12px; margin-top: 10px; display: block; }
        .code-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10; }
        .action-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;}
        
        .typing-indicator { display: flex; gap: 4px; padding: 8px 4px; }
        .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* FOOTER INPUT */
        footer { padding: 15px 20px 25px 20px; background: var(--bg-main); position: relative; }
        .input-box { display: flex; align-items: center; background: var(--bg-card); border-radius: 30px; padding: 8px 15px; gap: 10px; border: 1px solid var(--glass-border); }
        .plus-btn { background: rgba(255,255,255,0.05); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;}
        textarea#userInput { flex: 1; background: transparent; border: none; color: white; padding: 8px 0; font-size: 14px; outline: none; resize: none; max-height: 100px; line-height: 1.4; scrollbar-width: none; }
        #sendBtn, #micBtn, #stopBtn { background: transparent; color: var(--accent); border: none; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; border-radius: 50%;}
        #sendBtn { background: var(--accent); color: white; }
        #stopBtn { background: #ef4444; color: white; display: none; }
        #imgPreviewBox { position: absolute; bottom: 80px; left: 30px; background: var(--bg-card); padding: 8px; border-radius: 12px; border: 1px solid var(--accent); display: none; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index:100; }
        #imgPreviewBox img { height: 60px; border-radius: 8px; }
        .cancel-img-btn { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 12px; display:flex; align-items:center; justify-content:center;}
        
        #codePreviewModal { position: fixed; inset: 0; z-index: 100000; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .preview-container { width: 90%; height: 85%; max-width: 800px; background: var(--bg-main); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--glass-border); }
        .preview-header { background: var(--bg-card); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); }
        .preview-header span { color: white; font-weight: 600; font-size: 14px; }
        .close-preview-btn { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        #codePreviewFrame { flex: 1; width: 100%; border: none; background: #fff; }

        body.party-mode #bg { animation: partyBG 0.8s infinite alternate !important; background: #000; z-index: 100;}
        @keyframes partyBG { 0% { background: #ff0000; } 33% { background: #00ff00; } 66% { background: #0000ff; } 100% { background: #ff00ff; } }
    </style>
</head>
<body>
    <audio id="sfxSend" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sfxReceive" src="https://g.top4top.io/m_3824qlqkj0.mp3"></audio>
    <audio id="bgMusic" loop><source src="https://d.top4top.io/m_3820ralgz0.mp3" type="audio/mpeg"></audio>
    <audio id="partyMusic" loop><source src="https://g.top4top.io/m_3822qs5170.mp3" type="audio/mpeg"></audio>

    <div id="bg"></div>

    <div id="welcome-screen">
        <div class="welcome-robot">
            <div class="bot-greeting-bubble">Hey Tam 👋</div>
        </div>
        <div class="welcome-text">
            <p>Welcome back</p>
            <h1>How may I help<br>you today</h1>
        </div>
        <div class="welcome-controls">
            <i class="fa-solid fa-microphone ctrl-icon" onclick="openAppAndDictate()"></i>
            <div class="glowing-orb-btn" onclick="startApp()"></div>
            <i class="fa-regular fa-keyboard ctrl-icon" onclick="startApp()"></i>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-layer-group"></i> Menu & Histori</h3>
            <button class="close-sb-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-content">
            <button class="btn-control btn-accent" onclick="createNewSession()"><i class="fa-solid fa-plus"></i> Chat Baru</button>
            <div style="margin-top: 10px;">
                <select id="apiMenu" class="dropdown-menu" onchange="saveSettingsLocal()">
                    <option value="ditzz">🤖 Model: Nyawit AI (Bawaan)</option>
                    <option value="bard">🌟 Model: Gemini / Bard</option>
                    <option value="claude">🧠 Model: Claude AI</option>
                    <option value="api_custom">🚀 Model: API Custom</option>
                </select>
                <select id="personaMenu" class="dropdown-menu" onchange="saveSettingsLocal()">
                    <option value="humor">😂 Kepribadian: Humoris</option>
                    <option value="pro">👔 Kepribadian: Profesional</option>
                    <option value="hacker">💻 Kepribadian: Hacker</option>
                    <option value="teman">🤗 Kepribadian: Teman Curhat</option>
                </select>
                <select id="featureMenu" class="dropdown-menu" onchange="updatePlaceholder()">
                    <option value="chat">💬 Chat AI</option>
                    <option value="/gambar">🎨 Gambar</option>
                    <option value="/cuaca">☁️ Cuaca</option>
                    <option value="/satelit">🛰️ Lacak ISS</option>
                    <option value="/qr">🔲 QR Code</option>
                    <option value="/download">📥 Download Video</option>
                    <option value="/party">🪩 Mode Pesta</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button id="musicBtn" class="btn-control" onclick="toggleMusic()"><i class="fa-solid fa-music"></i> ON</button>
                <button id="voiceBtn" class="btn-control" onclick="toggleVoice()"><i class="fa-solid fa-volume-high"></i> ON</button>
                <button class="btn-control btn-danger" onclick="clearChat()" style="grid-column: span 2;"><i class="fa-solid fa-trash-can"></i> Bersihkan Obrolan</button>
            </div>
            <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                <label style="font-size: 11px; color: var(--text-muted); margin-bottom:10px; display:block;">Histori Obrolan</label>
                <div id="chatList"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header>
            <div class="header-left">
                <button class="back-btn" onclick="backToWelcome()"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="bot-info-header">
                    <span class="bot-name">Kohaku bot</span>
                    <span class="bot-status"><span class="status-dot"></span> Online</span>
                </div>
            </div>
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></button>
        </header>

        <main id="chat-history">
            <div id="empty-state">
                <div class="greeting-text">
                    <span style="font-size:20px;">👋</span><br><br>
                    Hi! I'm a Bot. Let me know if you have any questions.<br><br>
                    <span style="color:var(--text-muted); font-size:12px;">Select the topic or write below.</span>
                </div>
                <div class="cards-container">
                    <div class="topic-card card-1" onclick="sendCardText('Buatkan jadwal harian produktif')">
                        <div class="card-icon">📓</div>
                        <h4>Quickly add a page<br><span style="font-size:11px; font-weight:400;">Notion</span></h4>
                    </div>
                    <div class="topic-card card-2" onclick="sendCardText('Buatkan to-do list tugas')">
                        <div class="card-icon">✅</div>
                        <h4>Organize tasks<br><span style="font-size:11px; font-weight:400;">Todoist</span></h4>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <div id="imgPreviewBox">
                <img id="imgPreviewPic" src="">
                <button class="cancel-img-btn" onclick="cancelImage()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="input-box">
                <button class="plus-btn" onclick="document.getElementById('imgInput').click()"><i class="fa-solid fa-plus"></i></button>
                <input type="file" id="imgInput" style="display:none" accept="image/*" onchange="handleImageAttach(event)">
                <textarea id="userInput" rows="1" placeholder="Ask anything..." autocomplete="off"></textarea>
                <button id="micBtn" onclick="startDictation()"><i class="fa-solid fa-microphone"></i></button>
                <button id="sendBtn" style="display:none;" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                <button id="stopBtn" onclick="stopGeneration()"><i class="fa-solid fa-stop"></i></button>
            </div>
        </footer>
    </div>

    <!-- PREVIEW KODE -->
    <div id="codePreviewModal">
        <div class="preview-container">
            <div class="preview-header">
                <span>▶️ Live Preview</span>
                <button class="close-preview-btn" onclick="closePlayCode()">Tutup</button>
            </div>
            <iframe id="codePreviewFrame"></iframe>
        </div>
    </div>

    <script>
        // ================= BYPASS KEAMANAN LOCALSTORAGE =================
        let memoryStorage = {};
        const safeStorage = {
            getItem: (k) => { try { return localStorage.getItem(k); } catch(e) { return memoryStorage[k] || null; } },
            setItem: (k, v) => { try { localStorage.setItem(k, v); } catch(e) { memoryStorage[k] = v; } },
            removeItem: (k) => { try { localStorage.removeItem(k); } catch(e) { delete memoryStorage[k]; } }
        };
        // =================================================================

        const welcomeScreen = document.getElementById('welcome-screen');
        const appContainer = document.getElementById('app');
        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sfxSend = document.getElementById('sfxSend');
        const sfxReceive = document.getElementById('sfxReceive');
        const bgMusic = document.getElementById('bgMusic');
        const partyMusic = document.getElementById('partyMusic');

        let isGenerating = false;
        let abortController = null;
        let settings = { music: true, voice: true, persona: 'humor', apiModel: 'ditzz' };
        let attachedImageBase64 = null;
        
        let currentSessionId = safeStorage.getItem('nyawit_active_session') || 'nyawit_history_v8'; 
        let parsedSessions = { 'nyawit_history_v8': 'Obrolan Utama' };
        try { 
            const rawSessions = safeStorage.getItem('nyawit_sessions_list');
            if (rawSessions) parsedSessions = JSON.parse(rawSessions);
        } catch(e) {}
        let chatSessions = parsedSessions;

        function startApp() {
            loadSettingsLocal();
            if(settings.music) bgMusic.play().catch(e=>{});
            welcomeScreen.style.opacity = '0';
            welcomeScreen.style.transform = 'scale(1.05)';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                appContainer.classList.add('active');
                switchSession(currentSessionId); 
                renderSidebarList();
                checkEmptyState();
            }, 500);
        }

        function openAppAndDictate() { startApp(); setTimeout(() => startDictation(), 600); }
        function backToWelcome() {
            appContainer.classList.remove('active');
            setTimeout(() => {
                welcomeScreen.style.display = 'flex';
                void welcomeScreen.offsetWidth;
                welcomeScreen.style.opacity = '1';
                welcomeScreen.style.transform = 'scale(1)';
            }, 500);
        }

        input.addEventListener("input", function() { 
            this.style.height = "auto"; 
            this.style.height = (this.scrollHeight < 100 ? this.scrollHeight : 100) + "px"; 
            if(this.value.trim() !== "" || attachedImageBase64) {
                micBtn.style.display = 'none'; sendBtn.style.display = 'flex';
            } else {
                micBtn.style.display = 'flex'; sendBtn.style.display = 'none';
            }
        });

        function checkEmptyState() {
            const emptyState = document.getElementById('empty-state');
            const msgs = chatHistory.querySelectorAll('.msg-container');
            if(msgs.length === 0) {
                if(!emptyState) {
                    chatHistory.innerHTML = `<div id="empty-state">
                        <div class="greeting-text"><span style="font-size:20px;">👋</span><br><br>Hi! I'm a Bot. Let me know if you have any questions.<br><br><span style="color:var(--text-muted); font-size:12px;">Select the topic or write below.</span></div>
                        <div class="cards-container">
                            <div class="topic-card card-1" onclick="sendCardText('Buatkan jadwal harian produktif')"><div class="card-icon">📓</div><h4>Quickly add a page<br><span style="font-size:11px; font-weight:400;">Notion</span></h4></div>
                            <div class="topic-card card-2" onclick="sendCardText('Buatkan to-do list tugas')"><div class="card-icon">✅</div><h4>Organize tasks<br><span style="font-size:11px; font-weight:400;">Todoist</span></h4></div>
                        </div></div>`;
                }
            } else { if(emptyState) emptyState.remove(); }
        }

        function sendCardText(text) { input.value = text; input.dispatchEvent(new Event('input')); sendMessage(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        
        function renderSidebarList() {
            const list = document.getElementById('chatList'); list.innerHTML = '';
            for (let id in chatSessions) {
                const div = document.createElement('div');
                div.className = 'chat-item' + (id === currentSessionId ? ' active' : '');
                div.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" onclick="switchSession('${id}')">${chatSessions[id]}</span> <button onclick="deleteSession('${id}', event)"><i class="fa-solid fa-trash"></i></button>`;
                list.appendChild(div);
            }
        }

        function createNewSession() {
            const newId = 'chat_' + Date.now();
            chatSessions[newId] = "Sesi Chat " + (Object.keys(chatSessions).length + 1);
            safeStorage.setItem('nyawit_sessions_list', JSON.stringify(chatSessions));
            switchSession(newId);
        }

        function switchSession(id) {
            currentSessionId = id;
            safeStorage.setItem('nyawit_active_session', currentSessionId);
            chatHistory.innerHTML = safeStorage.getItem(currentSessionId) || '';
            addCopyButtons(); Prism.highlightAll(); scrollToBottom();
            renderSidebarList(); checkEmptyState();
            if(window.innerWidth < 600) document.getElementById('sidebar').classList.remove('open');
        }

        function deleteSession(id, event) {
            event.stopPropagation();
            if(Object.keys(chatSessions).length <= 1) return alert("Minimal harus ada 1 obrolan tersisa.");
            if(confirm("Hapus obrolan ini?")) {
                delete chatSessions[id]; safeStorage.removeItem(id);
                safeStorage.setItem('nyawit_sessions_list', JSON.stringify(chatSessions));
                if(currentSessionId === id) switchSession(Object.keys(chatSessions)[0]); else renderSidebarList();
            }
        }
        function saveChat() { safeStorage.setItem(currentSessionId, chatHistory.innerHTML); }

        function handleImageAttach(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachedImageBase64 = ev.target.result;
                    document.getElementById('imgPreviewPic').src = attachedImageBase64;
                    document.getElementById('imgPreviewBox').style.display = 'flex';
                    input.dispatchEvent(new Event('input')); 
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        }
        function cancelImage() { attachedImageBase64 = null; document.getElementById('imgPreviewBox').style.display = 'none'; input.dispatchEvent(new Event('input')); }

        function addCopyButtons() {
            document.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-actions')) return; 
                const actionsDiv = document.createElement('div'); actionsDiv.className = 'code-actions';
                const getCleanCode = () => { const cb = pre.querySelector('code'); return cb ? cb.innerText.trim() : pre.innerText.replace(/📋|▶️|✅|💾/g, '').trim(); };
                const playBtn = document.createElement('button'); playBtn.className = 'action-btn'; playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; playBtn.onclick = () => playCode(getCleanCode());
                const copyBtn = document.createElement('button'); copyBtn.className = 'action-btn'; copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
                copyBtn.onclick = () => { navigator.clipboard.writeText(getCleanCode()); copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>'; setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 2000); };
                actionsDiv.appendChild(playBtn); actionsDiv.appendChild(copyBtn); pre.appendChild(actionsDiv);
            });
        }
        async function playCode(code) {
            const modal = document.getElementById('codePreviewModal'); const frame = document.getElementById('codePreviewFrame');
            modal.style.display = 'flex'; setTimeout(() => { modal.style.opacity = '1'; }, 10);
            frame.src = URL.createObjectURL(new Blob([`<!DOCTYPE html><html><body style="background:#1e293b; color:#fff; font-family:sans-serif;">${code}</body></html>`], { type: 'text/html' }));
        }
        function closePlayCode() { document.getElementById('codePreviewModal').style.opacity = '0'; setTimeout(() => { document.getElementById('codePreviewModal').style.display = 'none'; }, 300); }

        function loadSettingsLocal() {
            try {
                const saved = safeStorage.getItem('nyawit_settings_v7');
                if(saved) settings = JSON.parse(saved);
                document.getElementById('personaMenu').value = settings.persona || 'humor';
                document.getElementById('apiMenu').value = settings.apiModel || 'ditzz';
                const voiceBtn = document.getElementById('voiceBtn');
                if(settings.voice) { voiceBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> ON'; voiceBtn.style.color = 'white'; } 
                else { voiceBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> OFF'; voiceBtn.style.color = 'var(--text-muted)'; }
                const musicBtn = document.getElementById('musicBtn');
                if(settings.music) { musicBtn.innerHTML = '<i class="fa-solid fa-music"></i> ON'; musicBtn.style.color = 'white'; } 
                else { musicBtn.innerHTML = '<i class="fa-solid fa-music"></i> OFF'; musicBtn.style.color = 'var(--text-muted)'; }
            } catch(e){}
        }

        function saveSettingsLocal() {
            settings.persona = document.getElementById('personaMenu').value;
            settings.apiModel = document.getElementById('apiMenu').value;
            safeStorage.setItem('nyawit_settings_v7', JSON.stringify(settings));
        }

        function toggleVoice() {
            settings.voice = !settings.voice; saveSettingsLocal();
            const voiceBtn = document.getElementById('voiceBtn');
            if (settings.voice) { voiceBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> ON'; voiceBtn.style.color = 'white'; } 
            else { voiceBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> OFF'; voiceBtn.style.color = 'var(--text-muted)'; if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
        }

        function toggleMusic() {
            settings.music = !settings.music; saveSettingsLocal();
            const musicBtn = document.getElementById('musicBtn');
            const isParty = document.body.classList.contains('party-mode');
            if (!settings.music) {
                bgMusic.pause(); partyMusic.pause(); musicBtn.innerHTML = '<i class="fa-solid fa-music"></i> OFF'; musicBtn.style.color = 'var(--text-muted)';
            } else {
                if (isParty) partyMusic.play(); else bgMusic.play();
                musicBtn.innerHTML = '<i class="fa-solid fa-music"></i> ON'; musicBtn.style.color = 'white';
            }
        }

        function getSystemPrompt() {
            const p = settings.persona;
            if(p === 'pro') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu adalah asisten profesional yang menjawab dengan sangat formal, akurat, padat, dan jelas tanpa basa-basi.";
            if(p === 'hacker') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu berbicara selayaknya hacker elit, sering menggunakan istilah teknis komputer, cyber security, dan menjawab dengan gaya misterius.";
            if(p === 'teman') return "Kamu adalah Nyawit AI yang dibuat oleh Ditzz. Kamu adalah teman curhat yang sangat empatik, pendengar yang baik, hangat, dan selalu memberikan dukungan moral dengan bahasa santai gaul Indonesia.";
            return "kamu adalah Nyawit AI yang di buat oleh ditzz kalo di tanya siapa pembuat mu kamu harus jawab ditzz, kamu ai yang ramah dan penuh dengan humor khas orang Indonesia dengan jokes-jokes yang sering bilang : saya akan lawan, dan hey antek antek asing, 19 juta lapangan pekerjaan, dan juga kamu harus kirim emoji setiap di tanya agar lebih humoris jangan lupa jokes nya setiap chat ya";
        }

        function speakText(text) {
            if (settings.voice && 'speechSynthesis' in window && !isGenerating) {
                let msg = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, '').replace(/[*#_]/g, ''));
                msg.lang = 'id-ID'; msg.rate = 1.1; window.speechSynthesis.speak(msg);
            }
        }

        function updatePlaceholder() {
            const m = document.getElementById('featureMenu').value;
            if (m === 'chat') { input.placeholder = "Ask anything..."; } 
            else if (m === '/download') { input.placeholder = "Tempel link URL video di sini..."; }
            else if (m === '/satelit' || m === '/party') { input.placeholder = "Tekan Kirim untuk mengeksekusi"; input.value = ""; input.dispatchEvent(new Event('input')); }
            else { input.placeholder = `Ketik untuk fitur ${m}...`; }
        }

        function scrollToBottom() { chatHistory.scrollTo({ top: chatHistory.scrollHeight, behavior: 'smooth' }); }
        function clearChat() { if(confirm("Bersihkan obrolan ini?")) { chatHistory.innerHTML = ''; checkEmptyState(); saveChat(); toggleSidebar(); } }

        function addMessage(role, text, isHTML = false) {
            const emptyState = document.getElementById('empty-state'); if(emptyState) emptyState.remove();
            const container = document.createElement('div'); container.className = `msg-container ${role}`;
            const bubble = document.createElement('div'); bubble.className = 'bubble';
            if (isHTML) bubble.innerHTML = text; else bubble.innerText = text;
            container.appendChild(bubble); chatHistory.appendChild(container); scrollToBottom(); return bubble;
        }

        function showTypingIndicator() {
            const emptyState = document.getElementById('empty-state'); if(emptyState) emptyState.remove();
            const container = document.createElement('div'); container.className = `msg-container ai`; container.id = "typingIndicator";
            const bubble = document.createElement('div'); bubble.className = 'bubble typing-indicator';
            bubble.innerHTML = `<span></span><span></span><span></span>`;
            container.appendChild(bubble); chatHistory.appendChild(container); scrollToBottom();
        }
        function hideTypingIndicator() { const ind = document.getElementById("typingIndicator"); if(ind) ind.remove(); }

        async function typeWriterEffect(element, markdownText) {
            let buffer = ""; sfxReceive.currentTime = 0; sfxReceive.play().catch(()=>{});
            for (let i = 0; i < markdownText.length; i += 4) {
                if (!isGenerating) break; buffer += markdownText.substring(i, i + 4);
                element.innerHTML = marked.parse(buffer); scrollToBottom(); await new Promise(r => setTimeout(r, 15)); 
            }
            element.innerHTML = marked.parse(markdownText); Prism.highlightAllUnder(element); addCopyButtons();
        }

        function stopGeneration() { if(abortController) abortController.abort(); finishGeneration(); }
        
        function findResponseText(obj) {
            if (typeof obj === 'string') return obj;
            if (!obj || typeof obj !== 'object') return JSON.stringify(obj);
            if (obj.result && obj.result.response && typeof obj.result.response === 'string') return obj.result.response;
            if (obj.result && obj.result.data && typeof obj.result.data === 'string') return obj.result.data;
            if (obj.result && typeof obj.result === 'string') return obj.result;
            if (obj.data && obj.data.result && typeof obj.data.result === 'string') return obj.data.result;
            if (obj.data && obj.data.response && typeof obj.data.response === 'string') return obj.data.response;
            if (obj.data && typeof obj.data === 'string') return obj.data;
            if (obj.response && typeof obj.response === 'string') return obj.response;
            if (obj.message && typeof obj.message === 'string') return obj.message;
            return "```json\n" + JSON.stringify(obj, null, 2) + "\n```";
        }

        async function sendMessage() {
            if (isGenerating) return; 
            const menu = document.getElementById('featureMenu').value;
            let rawQuery = input.value.trim();
            if (!rawQuery && (menu === '/party' || menu === '/satelit')) rawQuery = menu;
            else if (!rawQuery && !attachedImageBase64) return; 

            let finalQuery = (menu !== 'chat' && !rawQuery.startsWith(menu)) ? `${menu} ${rawQuery}` : rawQuery;
            sfxSend.currentTime = 0; sfxSend.play().catch(()=>{});

            let displayQueryHTML = finalQuery;
            if (attachedImageBase64) {
                displayQueryHTML += `<br><img src="${attachedImageBase64}" style="max-width:200px; border-radius:8px; margin-top:10px;">`;
                finalQuery += `\n[Terdapat Lampiran Gambar dari Pengguna]`;
            }

            input.value = ''; input.style.height = "auto"; input.blur(); 
            sendBtn.style.display = 'none'; micBtn.style.display = 'flex';
            addMessage('user', displayQueryHTML, true); cancelImage(); saveChat();

            isGenerating = true; micBtn.style.display = 'none'; stopBtn.style.display = 'flex'; 
            
            // ==========================================
            // FITUR SPESIFIK (Menggunakan RETURN early agar AI utama tidak terpanggil)
            // ==========================================
            if (finalQuery.toLowerCase() === '/party') {
                document.body.classList.toggle('party-mode');
                const isParty = document.body.classList.contains('party-mode');
                const statusTxt = isParty ? "DIAKTIFKAN! Waktunya berantas galau! 🎉" : "DIMATIKAN. Kembali ke mode serius. 🛑";
                
                if (settings.music) {
                    if (isParty) { bgMusic.pause(); partyMusic.play().catch(e=>console.log(e)); } 
                    else { partyMusic.pause(); partyMusic.currentTime=0; bgMusic.play().catch(e=>console.log(e)); }
                }
                const bub = addMessage('ai', ""); 
                await typeWriterEffect(bub, `Mode Pesta **${statusTxt}**`);
                speakText(isParty ? "Mode pesta diaktifkan." : "Mode pesta dimatikan.");
                finishGeneration(); return;
            }

            showTypingIndicator(); 

            try {
                if (finalQuery.toLowerCase() === '/satelit') {
                    const satRes = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                    const satData = await satRes.json();
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `🛰️ **Data Pelacakan Satelit ISS:**\n- Latitude: **${satData.latitude.toFixed(4)}**\n- Longitude: **${satData.longitude.toFixed(4)}**\n- Kecepatan: **${Math.round(satData.velocity)} km/jam**\n- Ketinggian: **${Math.round(satData.altitude)} km**`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/cuaca ')) {
                    const city = finalQuery.substring(7).trim();
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=id&format=json`);
                    const geoData = await geoRes.json();
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    if (!geoData.results) { await typeWriterEffect(bub, `❌ Kota **${city}** tidak ditemukan di satelit.`); } 
                    else {
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geoData.results[0].latitude}&longitude=${geoData.results[0].longitude}&current_weather=true`);
                        const weatherData = await weatherRes.json();
                        await typeWriterEffect(bub, `📡 **Laporan Cuaca:**\nCuaca di kota **${geoData.results[0].name}** saat ini bersuhu **${weatherData.current_weather.temperature}°C** dengan kecepatan angin **${weatherData.current_weather.windspeed} km/jam**. 🌤️`);
                    }
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/qr ')) {
                    const qrData = finalQuery.substring(4).trim();
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrData)}`;
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `QR Code berhasil dibuat untuk: **${qrData}**\n<br><img src="${qrUrl}" alt="QR" style="background:white;padding:10px;border-radius:10px;">`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/gambar ')) {
                    const imgPrompt = finalQuery.substring(8).trim();
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?seed=${Math.floor(Math.random()*10000)}&width=512&height=512&nologo=true`;
                    hideTypingIndicator(); const bub = addMessage('ai', "");
                    await typeWriterEffect(bub, `Wait Proses...\nVisualisasi untuk: **${imgPrompt}**\n<br><img src="${imgUrl}" style="border-radius:10px;margin-top:10px;max-width:100%;">`);
                    finishGeneration(); return;
                }

                if (finalQuery.toLowerCase().startsWith('/download ')) {
                    const videoUrl = finalQuery.substring(10).trim();
                    const dlApiUrl = `https://api-faa.my.id/faa/aio?url=${encodeURIComponent(videoUrl)}`;
                    
                    hideTypingIndicator(); 
                    const bub = addMessage('ai', "");
                    bub.innerHTML = "<em>🔄 Sedang mengambil media...</em>";
                    
                    try {
                        const dlRes = await fetch(dlApiUrl);
                        const dlData = await dlRes.json();
                        
                        if (dlData.status === true && dlData.result) {
                            const res = dlData.result;
                            let replyText = `📥 **Berhasil Menemukan Media! (Source: ${res.source})**\n\n`;
                            replyText += `**Judul:** ${res.title || "Tidak ada judul"}\n\n`;
                            
                            if (res.medias && res.medias.length > 0) {
                                res.medias.forEach(media => {
                                    let ext = media.extension ? media.extension.toLowerCase() : "";
                                    let qual = media.quality ? media.quality.toLowerCase() : "";
                                    
                                    replyText += `**Kualitas: ${media.quality || "Default"}**\n`;
                                    
                                    if (ext.includes("mp4") || ext.includes("webm") || ext.includes("mkv") || qual.includes("watermark") || qual.includes("video")) {
                                        replyText += `<video controls style="width: 100%; border-radius: 8px; margin-bottom: 5px;" src="${media.url}"></video>\n`;
                                        replyText += `🎥 <a href="${media.url}" target="_blank" style="color:var(--accent);">Klik untuk download</a>\n\n`;
                                    } else if (ext.includes("mp3") || ext.includes("m4a") || qual.includes("audio")) {
                                        replyText += `<audio controls style="width: 100%; margin-bottom: 5px;" src="${media.url}"></audio>\n`;
                                        replyText += `🎵 <a href="${media.url}" target="_blank" style="color:var(--accent);">Klik untuk download</a>\n\n`;
                                    } else if (ext.includes("jpg") || ext.includes("png") || ext.includes("jpeg") || ext.includes("webp")) {
                                        replyText += `<img src="${media.url}" style="width: 100%; border-radius: 8px; margin-bottom: 5px;" alt="Image">\n`;
                                        replyText += `🖼️ <a href="${media.url}" target="_blank" style="color:var(--accent);">Klik untuk download</a>\n\n`;
                                    } else {
                                        replyText += `📄 <a href="${media.url}" target="_blank" style="color:var(--accent);">Klik untuk download</a>\n\n`;
                                    }
                                    
                                    replyText += `---\n`;
                                });
                            } else {
                                replyText += `❌ Link media tidak ditemukan di dalam respons API.\n`;
                            }
                            bub.innerHTML = marked.parse(replyText);
                        } else {
                            bub.innerHTML = marked.parse(`❌ Gagal memproses URL. Pastikan link yang dikirim valid dan tidak diprivate.`);
                        }
                    } catch (err) {
                        bub.innerHTML = marked.parse(`❌ Terjadi kesalahan koneksi saat mencoba mengambil media.`);
                    }
                    
                    finishGeneration(); return;
                }

                // ==========================================
                // AI CHAT UTAMA (Terpanggil jika bukan fitur di atas)
                // ==========================================
                abortController = new AbortController();
                let apiUrl = ""; 
                const safePrompt = encodeURIComponent(getSystemPrompt()); 
                const safeQuery = encodeURIComponent(finalQuery);

                if (settings.apiModel === 'ditzz') {
                    apiUrl = `https://api-faa.my.id/faa/gpt-promt?prompt=${safePrompt}&query=${safeQuery}&text=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'bard') {
                    apiUrl = `https://api-faa.my.id/faa/bard-google?query=${safeQuery}&text=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'claude') {
                    apiUrl = `https://api-faa.my.id/faa/claude-ai?text=${safeQuery}&query=${safeQuery}&q=${safeQuery}`;
                } else if (settings.apiModel === 'api_custom') {
                    apiUrl = `https://api-Ditzx.com/chat?text=${safeQuery}`;
                }
                
                const responseText = await fetch(apiUrl, { signal: abortController.signal })
                    .then(res => res.text())
                    .then(rawText => { try { return findResponseText(JSON.parse(rawText)); } catch(e) { return rawText; } });
                
                hideTypingIndicator();
                if (responseText) {
                    const replyBubble = addMessage('ai', ""); 
                    await typeWriterEffect(replyBubble, responseText);
                    speakText(responseText); 
                }
            } catch (err) {
                hideTypingIndicator(); addMessage('ai', `<span style="color:#fca5a5;">Pesan Error: ${err.message}</span>`, true);
            }
            finishGeneration();
        }

        function finishGeneration() {
            isGenerating = false; stopBtn.style.display = 'none';
            if(input.value.trim() !== "" || attachedImageBase64) { sendBtn.style.display = 'flex'; micBtn.style.display = 'none'; } else { sendBtn.style.display = 'none'; micBtn.style.display = 'flex'; }
            saveChat();
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        function startDictation() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = "id-ID";
                input.placeholder = "Mendengarkan...";
                rec.start(); 
                rec.onresult = (e) => { input.value += " " + e.results[0][0].transcript; input.dispatchEvent(new Event('input')); };
                rec.onend = () => { updatePlaceholder(); };
            } else alert("Browser tidak mendukung mikrofon.");
        }
    </script>
</body>
</html>
